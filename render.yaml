# Render 블루프린트 — 백엔드를 Render 무료 웹 서비스로 옮길 때 쓴다 (docs/dev.md "호스팅 비용과 옮길 계획")
# 아직 이 파일로 배포해 본 적은 없다. 비밀값은 여기에 적지 않고 대시보드에서 직접 넣는다 (sync: false)
services:
  - type: web
    name: neighbo-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # DB를 보지 않는 확인 — DB가 멈춰 있어도 재시작을 되풀이하지 않는다
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGIN
        value: https://neighbo-liart.vercel.app
      - key: STORAGE_DRIVER
        value: s3
      - key: STORAGE_LOCAL_DIR
        value: /tmp/uploads
      - key: S3_ENDPOINT
        value: https://baacbtdzteourbivordx.storage.supabase.co/storage/v1/s3
      - key: S3_REGION
        value: ap-southeast-1
      - key: S3_BUCKET
        value: images
      - key: S3_PUBLIC_URL
        value: https://baacbtdzteourbivordx.supabase.co/storage/v1/object/public/images
      - key: SEED_SAMPLE
        value: '1'
      # 아래는 대시보드에서 직접 넣는다
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PROXY_SECRET
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
