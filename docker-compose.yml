# 로컬 개발용 PostgreSQL 16 — 개발 DB와 테스트 DB를 따로 둔다
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: neighbo
      POSTGRES_PASSWORD: neighbo
      POSTGRES_DB: neighbo_dev
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backend-node/prisma/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neighbo -d neighbo_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
