name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neighbo
          POSTGRES_PASSWORD: neighbo
          POSTGRES_DB: neighbo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neighbo -d neighbo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://neighbo:neighbo@127.0.0.1:5432/neighbo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # 백엔드 테스트는 시작할 때 테스트 DB에 prisma migrate deploy를 적용한다
      - run: npm test
      - run: npm run build
