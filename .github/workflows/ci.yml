name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neighbo
          POSTGRES_PASSWORD: neighbo
          POSTGRES_DB: neighbo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neighbo -d neighbo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://neighbo:neighbo@127.0.0.1:5432/neighbo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # 백엔드 테스트는 시작할 때 테스트 DB에 prisma migrate deploy를 적용한다
      - run: npm test
      - run: npm run build

  # 실제 브라우저로 두 서버를 띄워 가입부터 거래완료까지 돌린다 (docs/dev.md 테스트 전략)
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neighbo
          POSTGRES_PASSWORD: neighbo
          POSTGRES_DB: neighbo_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neighbo -d neighbo_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://neighbo:neighbo@127.0.0.1:5432/neighbo_e2e
      E2E_DATABASE_URL: postgresql://neighbo:neighbo@127.0.0.1:5432/neighbo_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate -w backend-node
      - run: npm run db:deploy -w backend-node
      - run: npx playwright install --with-deps chromium
        working-directory: frontend-next
      - run: npm run e2e -w frontend-next
      # 실패하면 화면 기록(trace)과 스크린샷을 내려받아 볼 수 있게 한다
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            frontend-next/playwright-report
            frontend-next/test-results
          retention-days: 7

  # Railway가 쓰는 Dockerfile이 실제로 빌드되고, 마이그레이션 후 서버가 뜨는지 확인한다
  image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neighbo
          POSTGRES_PASSWORD: neighbo
          POSTGRES_DB: neighbo_image
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neighbo -d neighbo_image"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t neighbo-backend .
      - name: 컨테이너를 띄우고 상태 확인
        run: |
          docker run -d --name backend --network host \
            -e PORT=4000 \
            -e DATABASE_URL=postgresql://neighbo:neighbo@127.0.0.1:5432/neighbo_image \
            -e JWT_SECRET=ci-only-jwt-secret-0123456789-0123456789 \
            -e PROXY_SECRET=ci-only-proxy-secret-0123456789-0123456789 \
            -e ALLOWED_ORIGIN=https://example.com \
            -e STORAGE_DRIVER=local \
            -e STORAGE_LOCAL_DIR=/tmp/uploads \
            neighbo-backend
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/readyz; then break; fi
            sleep 2
          done
          # 종료 신호가 서버까지 닿아 정상 종료(코드 0)하는지 확인한다
          docker stop --time 10 backend
          docker logs backend
          test "$(docker inspect backend --format '{{.State.ExitCode}}')" = "0"
          docker logs backend 2>&1 | grep -q '"shutdown":"SIGTERM"'
